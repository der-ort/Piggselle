name: Piggselle APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "piggselle-wip"]
    paths:
      - "Android/**"
      - ".github/**"
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.apk.outputs.version }}
      signed: ${{ steps.apk.outputs.signed }}
      apk_name: ${{ steps.apk.outputs.name }}
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" > /dev/null

      - name: Fetch native dependencies
        working-directory: .
        run: bash .github/scripts/fetch_deps.sh

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIGGSELLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/piggselle.jks"
            echo "PIGGSELLE_KEYSTORE=$RUNNER_TEMP/piggselle.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set; the APK is signed with a throwaway debug key."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            # Surface compiler errors and failed tests as annotations (job logs are long).
            grep -E "^e: |FAILED|AssertionError|What went wrong" -A2 "$RUNNER_TEMP/test.log" | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build release APK
        env:
          PIGGSELLE_KEYSTORE_PASSWORD: ${{ secrets.PIGGSELLE_KEYSTORE_PASSWORD }}
          PIGGSELLE_KEY_ALIAS: ${{ secrets.PIGGSELLE_KEY_ALIAS }}
          PIGGSELLE_KEY_PASSWORD: ${{ secrets.PIGGSELLE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "^e: |What went wrong|ERROR:" -A3 "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          OUT="$GITHUB_WORKSPACE/piggselle-$VERSION.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $OUT)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$PIGGSELLE_KEYSTORE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Verify APK privacy properties
        run: |
          APK="${{ steps.apk.outputs.path }}"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -n1)
          PERMS=$($AAPT dump permissions "$APK" | grep -oE "name='[^']+'" | sed "s/name='//;s/'//" | sort -u | tr '\n' ' ')
          echo "::notice title=Permissions::$PERMS"
          mkdir -p "$RUNNER_TEMP/dex" && unzip -q -o "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          BAD=""
          # FirebaseException & co. live in play-services-basement (used by the OSS licenses
          # screen) and are harmless; these packages are the ones that actually phone home.
          for pat in com/google/firebase/analytics com/google/firebase/messaging com/google/firebase/installations com/google/firebase/crashlytics com/google/firebase/perf com/google/android/gms/measurement io/ktor io/modelcontextprotocol; do
            if grep -rqa "L$pat/" "$RUNNER_TEMP/dex"; then BAD="$BAD $pat"; fi
          done
          if [ -n "$BAD" ]; then
            DETAIL=$(grep -rhoaE 'L(com/google/firebase|com/google/android/gms/measurement|io/ktor|io/modelcontextprotocol)/[A-Za-z0-9_/$]{0,80}' "$RUNNER_TEMP/dex" | sort -u | head -40 | tr '\n' ' ')
            echo "::error title=Telemetry found::$BAD | $DETAIL"
            cd "$GITHUB_WORKSPACE/Android/src"
            ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/deps.txt" 2>&1 || true
            grep -n -i "firebase\|datatransport" "$RUNNER_TEMP/deps.txt" | head -30 | while IFS= read -r l; do echo "::error title=dep::$l"; done
            for n in $(grep -n -i "firebase" "$RUNNER_TEMP/deps.txt" | head -3 | cut -d: -f1); do
              awk -v n="$n" 'NR<=n && /^[+\\]/ {top=$0} NR==n {print "top-level for line " n ": " top}' "$RUNNER_TEMP/deps.txt" | while IFS= read -r l; do echo "::error title=dep root::$l"; done
            done
            exit 1
          fi
          echo "::notice title=No telemetry::No Firebase, Measurement, Ktor or MCP classes in the APK"
          INFO=""
          for pat in com/google/android/datatransport com/google/android/gms/clearcut com/google/android/gms/common/internal/service; do
            if grep -rqa "L$pat/" "$RUNNER_TEMP/dex"; then INFO="$INFO $pat"; fi
          done
          echo "::notice title=Library telemetry code present (fenced)::${INFO:- none}"
          MANIFEST=$($AAPT dump xmltree "$APK" --file AndroidManifest.xml | grep -c "datatransport" || true)
          echo "::notice title=Datatransport manifest entries::$MANIFEST"
          TESTS=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -oE '<testsuite [^>]*' | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*/\1: \2 tests, \3 failures/' | tr '\n' ';')
          echo "::notice title=Unit tests::$TESTS"
          echo "::notice title=APK::$(basename $APK) $(du -h $APK | cut -f1) sha256 $(cut -d' ' -f1 $APK.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: piggselle-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: Android/src/app/build/reports/tests/

  smoke:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" > /dev/null

      - name: Fetch native dependencies
        working-directory: .
        run: bash .github/scripts/fetch_deps.sh

      - name: Build debug APK
        working-directory: ./Android/src
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "^e: |What went wrong|ERROR:" -A3 "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          echo "DEBUG_APK=$(ls $PWD/app/build/outputs/apk/debug/*.apk | head -n1)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/smoke_test.sh "$DEBUG_APK"

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piggselle-apk
          path: dist

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::$TAG already exists; bump versionName and versionCode to publish an update."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release (for Obtainium)
        # main publishes v<versionName> once; bump versionName/versionCode in app/build.gradle.kts
        # to ship an update. Debug-signed builds are marked as pre-releases.
        if: steps.existing.outputs.exists != 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Piggselle ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          files: |
            dist/${{ needs.build.outputs.apk_name }}
            dist/${{ needs.build.outputs.apk_name }}.sha256
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.signed != 'true' || contains(needs.build.outputs.version, '-') }}
          body: |
            ${{ needs.build.outputs.signed != 'true' && '⚠️ Test build signed with a throwaway debug key. Moving to another build (including a properly signed release) needs an uninstall first, which deletes chats and memories. See README → Release signing.' || 'Signed release.' }}

            Passed unit tests, APK privacy checks and an emulator smoke test. SHA-256 attached. Built from ${{ github.sha }}.
